pull_request_rules:
  - name: merge generated data updates
    conditions:
      - head=automation/nuget-update
    actions:
      review:
        type: APPROVE
        message: Automatically approving generated data update.
      merge:
        method: squash

  - name: merge dependabot updates
    conditions:
      - author=dependabot[bot]
    actions:
      review:
        type: APPROVE
        message: Automatically approving Dependabot update.
      merge:
        method: squash
