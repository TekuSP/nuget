name: nuget
on:
  workflow_dispatch:
    inputs:
      timeout:
        type: number
        description: Timeout in minutes
        required: false
        default: 360
      global:
        type: choice
        description: Collect General Stats
        required: true
        default: $false
        options: 
        - $false
        - $true
      owner:
        description: Collect Specific Owner Stats

  schedule:
    - cron: "0 2 1 * *"

permissions:
  contents: write
  pull-requests: write

jobs:
  nuget:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(github.event.inputs.timeout || '30') }}
    env:
      GH_TOKEN: ${{ github.token }}
      UPDATE_BRANCH: automation/nuget-update
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate sponsor data
        shell: pwsh
        continue-on-error: true
        run: |
          dotnet tool update -g dotnet-sponsor
          $owners = gc owners.json | convertfrom-json
          if ('${{ github.event.inputs.owner }}') {
            $owners = @('${{ github.event.inputs.owner }}')
          }
          foreach ($owner in $owners) {
            sponsor nuget --tos --exceptions --oss-only false --force --owner $owner
          }
          # global stats for all packages
          if (${{ github.event_name == 'workflow_dispatch' && github.event.inputs.global == '$true' }}) {
            sponsor nuget --tos --exceptions --force
          }

      - name: Detect generated changes
        id: changes
        shell: bash
        run: |
          git add *.json
          if git diff --cached --quiet; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push update branch
        if: steps.changes.outputs.has_changes == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$UPDATE_BRANCH"
          git commit -m "Update OSS contributors stats"
          git push --force --set-upstream origin "$UPDATE_BRANCH"

      - name: Create or update pull request
        if: steps.changes.outputs.has_changes == 'true'
        shell: bash
        run: |
          base_branch="${{ github.event.repository.default_branch || github.ref_name }}"
          pr_number="$(gh pr list --head "$UPDATE_BRANCH" --base "$base_branch" --state open --json number --jq '.[0].number // empty')"

          if [ -n "$pr_number" ]; then
            gh pr edit "$pr_number" \
              --title "Update OSS contributors stats" \
              --body "Automated update of generated NuGet sponsor statistics."
          else
            gh pr create \
              --base "$base_branch" \
              --head "$UPDATE_BRANCH" \
              --title "Update OSS contributors stats" \
              --body "Automated update of generated NuGet sponsor statistics."
          fi
