name: Create sponsor JSONs 
on:
  workflow_dispatch:
    inputs:
      timeout:
        type: number
        description: Timeout in minutes
        required: false
        default: 360

  schedule:
    - cron: "0 2 * * *"
env:
  GH_TOKEN: ${{ secrets.GH_PAT }}
  
jobs:
  nuget:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(github.event.inputs.timeout || '360') }}
    name: Create sponsor JSONs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        
      - name: Install dotnet-sponsor tool
        run: dotnet tool update -g dotnet-sponsor

      - name: Generate sponsor jsons
        shell: pwsh
        run: sponsor nuget --tos --exceptions --oss-only false --gh-only false --force --owner "${{ github.repository_owner }}" 
          
      - name: Create or update pull request
        uses: peter-evans/create-pull-request@v8.1.1
        with:
          token: ${{ secrets.GH_PAT }}
          branch: automation/nuget-update
          committer: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          author: ${{ github.actor }} <${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com>
          signoff: false
          delete-branch: true
          labels: |
            automated pr
          commit-message: Update generated NuGet data
          title: Update generated NuGet data
          body: Automated refresh of generated NuGet data.
          add-paths: |
            *.json
