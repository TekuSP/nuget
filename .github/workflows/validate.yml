name: Validate all JSON and YAML files

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  validate:
    name: Validate all JSON files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate JSON files
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          for file in *.json; do
            python -m json.tool "$file" > /dev/null
          done
